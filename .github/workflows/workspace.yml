name: Workspace checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, Node 24
        with:
          python-version: '3.10'
      - run: python -X utf8 scripts/studio.py validate
      - run: python -X utf8 scripts/check_publish.py
      - run: python -X utf8 -m unittest discover -s tests -v
      - name: Verify generated guides are current
        run: |
          python -X utf8 scripts/sync_guides.py
          git diff --exit-code
