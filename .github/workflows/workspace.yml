name: Workspace checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - run: python -X utf8 scripts/studio.py validate
      - run: python -X utf8 scripts/check_publish.py
      - run: python -X utf8 -m unittest discover -s tests -v
      - name: Verify generated guides are current
        run: |
          python -X utf8 scripts/sync_guides.py
          git diff --exit-code
